var bh='<button class="chip" aria-pressed="true" data-s="">Todos</button>';Object.keys(BS).forEach(function(c){bh+='<button class="chip" aria-pressed="false" data-s="'+BS[c]+'">'+c+'</button>'});$("#fb").innerHTML=bh;

'<div class="card"><h3>Introducción</h3><p style="margin:0;color:var(--mut)">'+esc(d?String(d).slice(0,900):"Este libro aún no tiene descripción. Ábralo en Open Library para ver ediciones y dónde leerlo.")+'</p></div><div class="card"><h3>Léalo en papel</h3><p style="margin:0;color:var(--mut)">Un libro físico se subraya, se presta y se recuerda mejor. Pregunte por él en una librería de su ciudad.</p><div class="row"><a class="btn gold" target="_blank" rel="noopener" href="https://openlibrary.org'+esc(b.dataset.key)+'">Ver en Open Library</a><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/search?q='+encodeURIComponent("comprar libro "+t+" "+a)+'">Buscar en librerías</a></div></div>';$("#dc").innerHTML=h})}
